[package]
name = "aptos-sdk-spec-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Behavioral specification tests for aptos-rust-sdk-v2"

# Keep this crate independent of the main workspace
[workspace]

[dependencies]
# The SDK we're testing - local path for development
# For CI, use: aptos-rust-sdk-v2 = { git = "https://github.com/aptos-labs/aptos-rust-sdk" }
aptos-rust-sdk-v2 = { path = "../../../aptos-rust-sdk/crates/aptos-rust-sdk-v2", features = ["full"] }
aptos-bcs = "0.1"

# BDD testing framework
cucumber = "0.21"
futures = "0.3"
async-trait = "0.1"

# Serialization for test vectors
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hex encoding
hex = "0.4"

# SHA2 hashing
sha2 = "0.10"

# HMAC for BIP-39 seed derivation
hmac = "0.12"

# Random number generation
rand = "0.8"

# Async runtime
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros"] }

# HTTP mocking for API client tests
wiremock = "0.6"

[[test]]
name = "specs"
harness = false

[features]
default = []
# Run only required tests
required = []
# Run only preferred tests  
preferred = []
# Run all tests including optional
all = []

