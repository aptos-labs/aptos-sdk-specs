name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ==========================================================================
  # Formatting & Linting
  # ==========================================================================
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun-install

      - name: Check formatting
        run: bun run format:check

  # ==========================================================================
  # TypeScript Lint
  # ==========================================================================
  typescript-lint:
    name: TS Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tests/typescript
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun-install

      - name: Lint
        run: bun run lint
        continue-on-error: true

  # ==========================================================================
  # TypeScript Tests (parallelized by feature category)
  # ==========================================================================
  typescript:
    name: TS (${{ matrix.category }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: core-types
            tags: "@core-types"
          - category: cryptography
            tags: "@cryptography"
          - category: accounts
            tags: "@account-management"
          - category: transactions
            tags: "@transaction-building"
          - category: api-clients
            tags: "@api-clients"
          - category: advanced
            tags: "@advanced and not @performance"
    defaults:
      run:
        working-directory: tests/typescript
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun-install

      - name: Run tests
        run: bun run cucumber-js --tags '${{ matrix.tags }}' --parallel 4
        continue-on-error: true

  # ==========================================================================
  # Go Tests (parallelized by feature category)
  # ==========================================================================
  go:
    name: Go (${{ matrix.category }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: core-types
            tags: "@core-types"
          - category: cryptography
            tags: "@cryptography"
          - category: accounts
            tags: "@account-management"
          - category: transactions
            tags: "@transaction-building"
          - category: api-clients
            tags: "@api-clients"
          - category: advanced
            tags: "@advanced and not @performance"
    defaults:
      run:
        working-directory: tests/go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-go-install
        with:
          go-version: "1.22"
          cache-dependency-path: tests/go/go.sum
          working-directory: tests/go

      - name: Run tests
        run: GODOG_TAGS='${{ matrix.tags }}' go test -v -count=1 ./...
        continue-on-error: true

  # ==========================================================================
  # Rust Tests
  # ==========================================================================
  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tests/rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Checkout aptos-rust-sdk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: aptos-labs/aptos-rust-sdk
          path: aptos-rust-sdk-checkout
          persist-credentials: false

      - name: Link SDK to expected location
        run: |
          # Cargo.toml expects aptos-rust-sdk at ../../../aptos-rust-sdk relative to tests/rust
          # That resolves to the parent of this repo. Create symlink at that level.
          # From workspace root, go up one level and create the symlink there
          ln -sf $GITHUB_WORKSPACE/aptos-rust-sdk-checkout $GITHUB_WORKSPACE/../aptos-rust-sdk
          ls -la $GITHUB_WORKSPACE/../
        working-directory: ${{ github.workspace }}

      - uses: ./.github/actions/setup-rust-install
        with:
          toolchain: "1.85.0"
          components: clippy
          cargo-lock-path: tests/rust/Cargo.lock

      - name: Lint
        run: cargo clippy --test specs -- -D warnings
        continue-on-error: true

      - name: Run required tests
        run: make test-required
        continue-on-error: true # Tests depend on external SDK and testnet

      - name: Run preferred tests
        run: make test-preferred
        continue-on-error: true

  # ==========================================================================
  # Python Tests
  # ==========================================================================
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tests/python
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python-install
        with:
          python-version: "3.11"
          requirements-path: tests/python/requirements.txt

      - name: Lint
        run: python -m flake8 steps/ support/ || true
        continue-on-error: true

      - name: Setup steps symlink
        run: |
          # Create symlink so behave can find steps from the features directory
          # Target is relative to where the symlink is placed (features/)
          ln -sf ../tests/python/steps ../../features/steps
          ln -sf ../tests/python/environment.py ../../features/environment.py

      - name: Run required tests
        run: make test-required
        continue-on-error: true # Tests depend on testnet which may be flaky

      - name: Run preferred tests
        run: make test-preferred
        continue-on-error: true

  # ==========================================================================
  # .NET Tests
  # ==========================================================================
  dotnet:
    name: .NET Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tests/dotnet
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dotnet-install
        with:
          dotnet-version: "8.0.x"
          working-directory: tests/dotnet

      - name: Build
        run: dotnet build --no-restore

      - name: Run required tests
        run: make test-required
        continue-on-error: true # Tests depend on testnet which may be flaky

      - name: Run preferred tests
        run: make test-preferred
        continue-on-error: true

  # ==========================================================================
  # Java Tests
  # ==========================================================================
  java:
    name: Java Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tests/java
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-java-maven-install
        with:
          java-version: "21"

      - name: Run required tests
        run: make test-required
        continue-on-error: true # Tests depend on testnet which may be flaky

      - name: Run preferred tests
        run: make test-preferred
        continue-on-error: true

  # ==========================================================================
  # Kotlin Tests
  # ==========================================================================
  kotlin:
    name: Kotlin Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tests/kotlin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-java-gradle-install
        with:
          java-version: "21"

      - name: Run required tests
        run: make test-required
        continue-on-error: true # Tests depend on testnet which may be flaky

      - name: Run preferred tests
        run: make test-preferred
        continue-on-error: true

  # ==========================================================================
  # Swift Tests (macOS only — requires Swift 6.0 / Xcode 16+)
  # ==========================================================================
  swift:
    name: Swift Tests
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tests/swift
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-swift-install
        with:
          working-directory: tests/swift

      - name: Setup features and test vectors
        run: make link-features

      - name: Build
        run: swift build

      - name: Run required tests
        run: swift test
        continue-on-error: true

      - name: Test summary
        if: always()
        run: |
          echo "## Swift Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SDK: aptos-labs/aptos-swift-sdk (official)" >> $GITHUB_STEP_SUMMARY
          echo "Runner: macOS 15 (Sequoia)" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # C++ Tests (disabled - SDK not yet available)
  # ==========================================================================
  # cpp:
  #   name: C++ Tests
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: tests/cpp
  #   steps:
  #     - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
  #       with:
  #         persist-credentials: false
  #
  #     - uses: ./.github/actions/setup-conan-install
  #       with:
  #         output-folder: build
  #
  #     - name: Build
  #       run: |
  #         cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release -G Ninja
  #         cmake --build build
  #
  #     - name: Run tests
  #       run: ./build/aptos_spec_tests ../../features --tags "@required"
  #       continue-on-error: true

  # ==========================================================================
  # Summary Job
  # ==========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - format-check
      - typescript-lint
      - typescript
      - go
      - rust
      - python
      - dotnet
      - java
      - kotlin
      - swift
    if: always()
    steps:
      - name: Check required jobs
        run: |
          # Only format check is required - SDK tests depend on external services
          if [[ "${{ needs.format-check.result }}" != "success" ]]; then
            echo "Format check failed"
            exit 1
          fi

          # Report on SDK test results (informational)
          echo "=== SDK Test Results (informational) ==="
          echo "TS Lint: ${{ needs.typescript-lint.result }}"
          echo "TypeScript (matrix): ${{ needs.typescript.result }}"
          echo "Go (matrix): ${{ needs.go.result }}"
          echo "Rust: ${{ needs.rust.result }}"
          echo "Python: ${{ needs.python.result }}"
          echo ".NET: ${{ needs.dotnet.result }}"
          echo "Java: ${{ needs.java.result }}"
          echo "Kotlin: ${{ needs.kotlin.result }}"
          echo "Swift: ${{ needs.swift.result }}"
          echo ""
          echo "Note: SDK tests depend on external services (testnet, faucet)"
          echo "and may fail due to network issues, not code problems."
          echo ""
          echo "Format check passed - CI successful!"
