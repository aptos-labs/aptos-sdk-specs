name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      sdk:
        description: "SDK to test (or 'all')"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - typescript
          - go
          - rust
          - python
          - dotnet
          - java
          - kotlin
          - swift
          - cpp

jobs:
  # ==========================================================================
  # TypeScript Full Tests
  # ==========================================================================
  typescript:
    name: TypeScript (Full)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sdk == 'all' || github.event.inputs.sdk == 'typescript' || github.event_name == 'schedule' }}
    defaults:
      run:
        working-directory: tests/typescript
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run all tests
        run: bun test

      - name: Generate report
        if: always()
        run: |
          echo "## TypeScript Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Go Full Tests
  # ==========================================================================
  go:
    name: Go (Full)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sdk == 'all' || github.event.inputs.sdk == 'go' || github.event_name == 'schedule' }}
    defaults:
      run:
        working-directory: tests/go
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tests/go/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run all tests
        run: make test

  # ==========================================================================
  # Rust Full Tests
  # ==========================================================================
  rust:
    name: Rust (Full)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sdk == 'all' || github.event.inputs.sdk == 'rust' || github.event_name == 'schedule' }}
    defaults:
      run:
        working-directory: tests/rust
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tests/rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('tests/rust/Cargo.lock') }}

      - name: Run all tests
        run: make test

  # ==========================================================================
  # Python Full Tests
  # ==========================================================================
  python:
    name: Python (Full)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sdk == 'all' || github.event.inputs.sdk == 'python' || github.event_name == 'schedule' }}
    defaults:
      run:
        working-directory: tests/python
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tests/python/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all tests
        run: make test

  # ==========================================================================
  # .NET Full Tests
  # ==========================================================================
  dotnet:
    name: .NET (Full)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sdk == 'all' || github.event.inputs.sdk == 'dotnet' || github.event_name == 'schedule' }}
    defaults:
      run:
        working-directory: tests/dotnet
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run all tests
        run: make test

  # ==========================================================================
  # Java Full Tests
  # ==========================================================================
  java:
    name: Java (Full)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sdk == 'all' || github.event.inputs.sdk == 'java' || github.event_name == 'schedule' }}
    defaults:
      run:
        working-directory: tests/java
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run all tests
        run: make test

  # ==========================================================================
  # Kotlin Full Tests
  # ==========================================================================
  kotlin:
    name: Kotlin (Full)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sdk == 'all' || github.event.inputs.sdk == 'kotlin' || github.event_name == 'schedule' }}
    defaults:
      run:
        working-directory: tests/kotlin
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run all tests
        run: make test

  # ==========================================================================
  # Swift Full Tests (macOS only — requires Swift 6.0 / Xcode 16+)
  # ==========================================================================
  swift:
    name: Swift (Full)
    runs-on: macos-15
    if: ${{ github.event.inputs.sdk == 'all' || github.event.inputs.sdk == 'swift' || github.event_name == 'schedule' }}
    defaults:
      run:
        working-directory: tests/swift
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          swift --version

      - name: Setup features and test vectors
        run: make link-features

      - name: Resolve dependencies
        run: swift package resolve

      - name: Run all tests
        run: swift test

  # ==========================================================================
  # C++ Full Tests
  # ==========================================================================
  cpp:
    name: C++ (Full)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.sdk == 'all' || github.event.inputs.sdk == 'cpp' || github.event_name == 'schedule' }}
    defaults:
      run:
        working-directory: tests/cpp
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup Conan
        run: |
          pip install conan
          conan profile detect

      - name: Install Conan dependencies
        run: conan install . --output-folder=build --build=missing

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build

      - name: Run all tests
        run: ./build/aptos_spec_tests ../../features
